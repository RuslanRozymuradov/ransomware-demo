<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Güncellemesi</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.3; }
        
        #terminal-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 600px; height: 80%; background: rgba(0, 0, 0, 0.85);
            border: 2px solid #0f0; border-radius: 8px; z-index: 2; padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4); overflow-y: auto; color: #0f0;
            transition: all 0.3s ease;
        }

        #terminal-box::-webkit-scrollbar { width: 5px; }
        #terminal-box::-webkit-scrollbar-thumb { background: #0f0; }

        .red-alert { border-color: #f00 !important; color: #f00 !important; box-shadow: 0 0 40px rgba(255, 0, 0, 0.6) !important; }
        .red-alert::-webkit-scrollbar-thumb { background: #f00 !important; }
        .safe-mode { border-color: #00ffcc !important; color: #00ffcc !important; box-shadow: 0 0 40px rgba(0, 255, 204, 0.5) !important; }

        .red-text { color: #f00; font-weight: bold; }
        .cursor { display: inline-block; width: 8px; height: 15px; background-color: #0f0; animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Glitch Sarsıntı Efekti */
        @keyframes shake {
            0% { transform: translate(-50%, -50%) translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-50%, -50%) translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-50%, -50%) translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(-50%, -50%) translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(-50%, -50%) translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-50%, -50%) translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-50%, -50%) translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(-50%, -50%) translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-50%, -50%) translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(-50%, -50%) translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(-50%, -50%) translate(1px, -2px) rotate(-1deg); }
        }
        .glitch-active { animation: shake 0.4s infinite; box-shadow: 0 0 60px rgba(255, 0, 0, 0.9) !important; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div id="terminal-box">
        <div id="terminal"></div><span class="cursor" id="cursor"></span>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAX_8Tu3z-rfkBBtpRzNMdyKwVADXjXras",
            authDomain: "deneme-4f8f3.firebaseapp.com",
            databaseURL: "https://deneme-4f8f3-default-rtdb.firebaseio.com",
            projectId: "deneme-4f8f3",
            storageBucket: "deneme-4f8f3.firebasestorage.app",
            messagingSenderId: "891754162517",
            appId: "1:891754162517:web:1794bcb4ab265dc7c7a7dc"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Sayacı 1 Arttır
        db.ref('qr_counter').transaction((current_value) => {
            return (current_value || 0) + 1;
        });

        // Matrix Yağmuru
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        let matrixColor = '#0f0';

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = matrixColor;
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        const terminal = document.getElementById('terminal');
        const terminalBox = document.getElementById('terminal-box');
        const cursor = document.getElementById('cursor');

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        async function typeLine(text, speed = 30, cssClass = "", isInstant = false) {
            let el = document.createElement('div');
            if (cssClass) el.className = cssClass;
            terminal.appendChild(el);
            if (isInstant) {
                el.innerHTML = text;
            } else {
                for (let i = 0; i < text.length; i++) {
                    el.innerHTML += text.charAt(i);
                    terminalBox.scrollTop = terminalBox.scrollHeight;
                    await sleep(speed);
                }
            }
        }

        async function runSimulation() {
            await sleep(800);
            await typeLine("root@system:~# ./payload_exec.sh --bypass-security", 40);
            await sleep(500);
            
            // --- 1. SESSİZ İSTİHBARAT (IP & Cihaz Analizi) ---
            let ipInfo = "Bağlantı Çözümleniyor...";
            try {
                let response = await fetch('https://ipapi.co/json/');
                if(response.ok) {
                    let data = await response.json();
                    ipInfo = `${data.ip} (${data.org || 'Bilinmeyen ISP'} - ${data.city || 'Bilinmeyen Bölge'})`;
                }
            } catch(e) {}

            let ua = navigator.userAgent;
            let os = "Bilinmeyen Sistem";
            if (/android/i.test(ua)) os = "Android OS";
            if (/iPad|iPhone|iPod/.test(ua)) os = "Apple iOS";
            let cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Çekirdekli İşlemci` : "Bilinmeyen Donanım";

            await typeLine(`[+] Cihaz Tespiti: ${os} | ${cores}`, 20, "red-text");
            await sleep(400);
            await typeLine(`[+] Ağ Geçidi: ${ipInfo}`, 20, "red-text");
            await sleep(600);
            
            await typeLine("[*] Güvenlik duvarı aşıldı.", 20, "safe-mode", true);
            await sleep(600);
            await typeLine("[!] AES-256 Şifreleme Modülü Başlatılıyor...", 30);
            await sleep(1000);

            const files = [
                "/storage/DCIM/Camera/IMG_2023.jpg",
                "/storage/WhatsApp/Databases/msg.db",
                "/data/com.android.providers.contacts/contacts.db"
            ];
            terminal.innerHTML += "<br>";
            for (let file of files) {
                await typeLine(`Şifreleniyor: ${file}`, 15);
                await sleep(300);
                await typeLine(" -> [KİLİTLENDİ]", 10, "red-text", true);
                await sleep(400);
            }

            // --- 2. GÖRSEL PANİK (Titreme & Dark Web Upload) ---
            await sleep(800);
            terminal.innerHTML = "";
            terminalBox.classList.add("red-alert");
            terminalBox.classList.add("glitch-active");
            matrixColor = '#ff0000';
            cursor.style.backgroundColor = '#ff0000';

            await typeLine("!!! KRİTİK GÜVENLİK İHLALİ !!!", 40, "red-text");
            await sleep(400);
            await typeLine("> Cihaz kontrolü kaybedildi. Kişisel veriler uzak sunucuya paketleniyor...", 30, "red-text");
            
            terminal.innerHTML += `<br><div style="border: 1px solid #f00; width: 100%; height: 22px; background: #300; margin-top: 10px;"><div id="uploadBar" style="width: 0%; height: 100%; background: #f00; transition: width 0.2s;"></div></div>`;
            terminal.innerHTML += `<div id="uploadText" style="color: #f00; font-weight: bold; margin-top: 8px; font-size: 14px;">DARK WEB SUNUCUSUNA AKTARILIYOR: %0</div>`;
            
            let uploadProgress = 0;
            while(uploadProgress < 100) {
                uploadProgress += Math.floor(Math.random() * 10) + 2; 
                if(uploadProgress > 100) uploadProgress = 100;
                
                document.getElementById('uploadBar').style.width = uploadProgress + '%';
                document.getElementById('uploadText').innerText = `KİŞİSEL VERİLER AKTARILIYOR: %${uploadProgress}`;
                terminalBox.scrollTop = terminalBox.scrollHeight;
                await sleep(350); 
            }

            await sleep(500);
            await typeLine("[!] AKTARIM TAMAMLANDI. Cihaz tamamen kilitleniyor...", 20, "red-text");
            await sleep(2500); 

            // --- 3. EĞİTİM VE GÜVENLİ EKRANA DÖNÜŞ ---
            terminalBox.classList.remove("glitch-active");
            terminal.innerHTML = "";
            terminalBox.classList.remove("red-alert");
            terminalBox.classList.add("safe-mode");
            matrixColor = '#005511';
            cursor.style.backgroundColor = '#00ffcc';

            await typeLine("==========================================", 10, "safe-mode");
            await typeLine("   SİMÜLASYON TAMAMLANDI - GÜVENDESİNİZ   ", 30, "safe-mode");
            await typeLine("==========================================", 10, "safe-mode");
            await sleep(800);
            await typeLine("> Az önce 'Quishing' (QR Oltalama) kurbanı oldunuz.", 30, "safe-mode");
            await typeLine("> Kaynağını bilmediğiniz QR kodlar, cihazınıza fidye yazılımı (Ransomware) bulaştırabilir ve verilerinizi çalabilir.", 30, "safe-mode");
            terminal.innerHTML += "<br>";
            await sleep(800);
            await typeLine("📸 Ekran görüntüsü alıp İstanbul Medipol Üniversitesi ISTRL sergi standımıza gelerek bilgi alabilirsiniz!", 30, "safe-mode");
        }

        window.onload = runSimulation;
    </script>
</body>
</html>
