<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Sayaç</title>
    <style>
        body { background: #111; color: #0f0; font-family: 'Courier New', Courier, monospace; text-align: center; padding-top: 10vh; }
        .box { border: 1px solid #0f0; display: inline-block; padding: 40px; border-radius: 10px; background: #000; box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
        .count { font-size: 80px; font-weight: bold; margin: 20px 0; color: #fff; text-shadow: 0 0 10px #fff; }
        button { background: #f33; color: white; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Ransomware QR Tarama Sayısı</h1>
        <div class="count" id="val">0</div>
        <button onclick="resetCount()">Sayacı Sıfırla</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAX_8Tu3z-rfkBBtpRzNMdyKwVADXjXras",
            authDomain: "deneme-4f8f3.firebaseapp.com",
            databaseURL: "https://deneme-4f8f3-default-rtdb.firebaseio.com",
            projectId: "deneme-4f8f3",
            storageBucket: "deneme-4f8f3.firebasestorage.app",
            messagingSenderId: "891754162517",
            appId: "1:891754162517:web:1794bcb4ab265dc7c7a7dc",
            measurementId: "G-EBZ5VMT6TD"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.database();
        let offset = parseInt(localStorage.getItem('qr_offset')) || 0;
        let globalCount = 0;

        db.ref('qr_counter').on('value', (snapshot) => {
            globalCount = snapshot.val() || 0;
            let displayCount = globalCount - offset;
            document.getElementById('val').innerText = displayCount > 0 ? displayCount : 0;
        });

        function resetCount() {
            offset = globalCount;
            localStorage.setItem('qr_offset', offset);
            document.getElementById('val').innerText = 0;
        }
    </script>
</body>
</html>
