<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Sayaç</title>
    <style>
        body { background-color: #111; color: #0f0; font-family: 'Courier New', Courier, monospace; text-align: center; padding-top: 10vh; }
        .box { border: 1px solid #0f0; display: inline-block; padding: 40px; border-radius: 10px; background: #000; box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
        h1 { font-size: 24px; margin: 0 0 15px 0; }
        .count { font-size: 80px; font-weight: bold; margin: 20px 0; color: #fff; text-shadow: 0 0 10px #fff; }
        button { background-color: #ff3333; color: white; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #cc0000; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Ransomware QR Tarama Sayısı</h1>
        <div class="count" id="countDisplay">...</div>
        <button onclick="resetCount()">Sayacı Sıfırla</button>
    </div>

    <script>
        const apiUrl = 'https://api.counterapi.dev/v1/siber_sergi_ruslan/ransomware_qr';
        let globalCount = 0;
        let offset = parseInt(localStorage.getItem('qr_offset')) || 0;

        async function loadCount() {
            let res = await fetch(apiUrl);
            let data = await res.json();
            globalCount = data.count || 0;
            document.getElementById('countDisplay').innerText = Math.max(0, globalCount - offset);
        }

        function resetCount() {
            offset = globalCount;
            localStorage.setItem('qr_offset', offset);
            document.getElementById('countDisplay').innerText = 0;
        }

        loadCount();
        setInterval(loadCount, 3000);
    </script>
</body>
</html>
